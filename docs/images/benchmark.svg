<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">dekupe throughput by output type</title>
  <desc id="d">Frames per second on a 1080x1920 clip, RTX 5070, ResNet50 model. Green screen 53.9, alpha matte 50.6, ProRes 4444 with alpha 43.3, VP9 WebM with alpha 18.8, all five outputs at once 13.3. Reference line at 25 fps.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #8a8984; }
    .bar { fill: #2a78d6; }
    .grid { stroke: #e6e5e0; stroke-width: 1; }
    .ref { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 5 4; }
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a998f; }
      .bar { fill: #3987e5; } .grid { stroke: #33332f; } .ref { stroke: #9a998f; }
    }
  </style>
  <rect class="bg" width="760" height="330" rx="12"/>
  <text class="ink" x="28" y="40" font-size="18" font-weight="600">Throughput by output (frames per second, higher is better)</text>
  <text class="ink2" x="28" y="62" font-size="13">1080×1920 clip · RTX 5070 · ResNet50 · inference + decode + encode, end to end</text>

  <!-- grid: x = 230 + fps * 8.1667 -->
  <g>
    <line class="grid" x1="230" y1="84" x2="230" y2="292"/>
    <line class="grid" x1="311.7" y1="84" x2="311.7" y2="292"/>
    <line class="grid" x1="393.3" y1="84" x2="393.3" y2="292"/>
    <line class="grid" x1="475" y1="84" x2="475" y2="292"/>
    <line class="grid" x1="556.7" y1="84" x2="556.7" y2="292"/>
    <line class="grid" x1="638.3" y1="84" x2="638.3" y2="292"/>
    <line class="grid" x1="720" y1="84" x2="720" y2="292"/>
  </g>
  <g class="muted" font-size="12" text-anchor="middle">
    <text x="230" y="310">0</text><text x="311.7" y="310">10</text><text x="393.3" y="310">20</text>
    <text x="475" y="310">30</text><text x="556.7" y="310">40</text><text x="638.3" y="310">50</text><text x="720" y="310">60</text>
  </g>

  <!-- bars: 28px tall, 40px pitch, rounded data-end -->
  <g font-size="14">
    <text class="ink2" x="216" y="113" text-anchor="end">Green screen (H.264)</text>
    <path class="bar" d="M230 94 H666.2 a4 4 0 0 1 4 4 V118 a4 4 0 0 1 -4 4 H230 Z"/>
    <text class="ink" x="678" y="113" font-weight="600">53.9</text>

    <text class="ink2" x="216" y="153" text-anchor="end">Alpha matte (MP4)</text>
    <path class="bar" d="M230 134 H639.2 a4 4 0 0 1 4 4 V158 a4 4 0 0 1 -4 4 H230 Z"/>
    <text class="ink" x="651" y="153" font-weight="600">50.6</text>

    <text class="ink2" x="216" y="193" text-anchor="end">ProRes 4444 + alpha</text>
    <path class="bar" d="M230 174 H579.6 a4 4 0 0 1 4 4 V198 a4 4 0 0 1 -4 4 H230 Z"/>
    <text class="ink" x="592" y="193" font-weight="600">43.3</text>

    <text class="ink2" x="216" y="233" text-anchor="end">VP9 WebM + alpha</text>
    <path class="bar" d="M230 214 H379.5 a4 4 0 0 1 4 4 V238 a4 4 0 0 1 -4 4 H230 Z"/>
    <text class="ink" x="392" y="233" font-weight="600">18.8</text>

    <text class="ink2" x="216" y="273" text-anchor="end">All five at once</text>
    <path class="bar" d="M230 254 H334.6 a4 4 0 0 1 4 4 V278 a4 4 0 0 1 -4 4 H230 Z"/>
    <text class="ink" x="347" y="273" font-weight="600">13.3</text>
  </g>

  <!-- reference: real time for 25 fps footage -->
  <line class="ref" x1="434.2" y1="84" x2="434.2" y2="292"/>
  <text class="muted" x="434.2" y="80" font-size="12" text-anchor="middle">real time @ 25 fps</text>
</svg>
